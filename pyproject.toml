[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmchess-lab"
version = "0.2.0"
description = "Auditable language-model chess experiments and game replays"
requires-python = ">=3.11"
dependencies = ["python-chess==1.999", "httpx>=0.28,<0.29", "python-dotenv>=1,<2", "openai>=3.11,<4", "PyYAML>=6,<7", "flask>=3.1.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
video = ["Pillow>=12,<13", "numpy>=2,<3", "cairosvg>=2.9,<3"]

[project.scripts]
llmchess-lab = "llmchess_lab.run:main"

[tool.setuptools.packages.find]
where = ["src"]
